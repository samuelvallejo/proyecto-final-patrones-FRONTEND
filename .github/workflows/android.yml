name: Android screen sharing
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile native capture application
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: streamguard-android-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-release.*
          retention-days: 7
